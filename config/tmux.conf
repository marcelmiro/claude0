# Claude0-owned tmux integration. Personal presentation, navigation, clipboard
# behavior, plugins, and host defaults belong to dotfiles.

# Server-side commands do not run through the login shell. Claude0 owns only the
# PATH entries required to resolve its own Bun-backed executable.
if-shell 'test "$(uname -s)" = Darwin' \
  'set-environment -gF PATH "/opt/homebrew/bin:#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"' \
  'set-environment -gF PATH "#{HOME}/.bun/bin:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin"'

# Claude0 popup and attention navigation. The {{BIND_*}} tokens are rendered by
# `claude0 setup` from config.json's tmux.keys ("prefix X" ⇒ bind-key X, bare
# "M-x" ⇒ bind-key -n M-x).
{{BIND_POPUP}} run-shell 'tmux set-environment CLAUDE0_FOCUS_PANE "#{pane_id}"' \; display-popup -E -w 90% -h 85% claude0
{{BIND_NEXT}} run-shell 'claude0 next'

# Expose a composable status segment. The personal tmux profile decides where
# it appears instead of Claude0 replacing the entire status bar.
set -g status-interval 3
set -g @claude0_status '#[fg=#FFFFFF]#(claude0 status)#[default]'

# Claude0 owns its save/restore hooks. A user-managed (TPM) tmux-resurrect keeps
# loading itself; with none present, `claude0 setup` renders the token below into
# a run-shell line loading a claude0-owned clone pinned to a known-good commit.
# That pin's default @resurrect-processes excludes `claude` — and must keep
# excluding it: resurrect respawning a fresh claude while
# `claude0 restore-sessions` resumes the real one corrupts the transcript.
set -g @resurrect-hook-post-save-all 'claude0 save-sessions'
set -g @resurrect-hook-post-restore-all 'claude0 restore-sessions'
{{RESURRECT_LOAD}}
